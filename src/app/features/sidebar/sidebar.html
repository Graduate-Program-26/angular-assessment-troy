<div hlmSidebarWrapper>
  <hlm-sidebar>

      <span>Deezer</span>
    </div>

    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel>Discover</div>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton [routerLink]="['/']">Search</a>
            </li>
          </ul>
        </div>
      </div>

      <div hlmSidebarGroup>
        <div hlmSidebarGroupLabel>Playlists</div>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton>Late night drive</a>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div hlmSidebarFooter></div>
  </hlm-sidebar>

  <ng-content />
</div>
