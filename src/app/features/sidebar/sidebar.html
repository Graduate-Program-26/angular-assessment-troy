<div hlmSidebarWrapper>
  <hlm-sidebar>
    <div hlmSidebarHeader>
      <div class="flex items-center gap-2 px-1 py-1">
        <ng-icon hlm name="lucideRadio" size="sm" class="text-primary shrink-0" />
        <span class="font-semibold tracking-tight">Deezerfy</span>
      </div>
    </div>

    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton [routerLink]="['/']">
                <ng-icon hlm size="sm" name="lucideSearch" />
                Search
              </a>
            </li>
            <li hlmSidebarMenuItem>
              <a hlmSidebarMenuButton [routerLink]="['/playlist']">
                <ng-icon hlm size="sm" name="lucideListMusic" />
                Playlists
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div hlmSidebarFooter></div>
  </hlm-sidebar>

  <ng-content />
</div>
